name: Windows

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/Windows.yml
      - src/compiler/common/windows_utils.cpp
      - include/neug/compiler/common/windows_utils.h
      - scripts/install_deps.ps1
      - scripts/build_windows.bat
  workflow_call:
    inputs:
      extensions:
        description: 'Semicolon-separated Windows-compatible extensions to build and test.'
        type: string
        default: ''
      architectures:
        description: 'JSON array of Windows build architectures: x86_64 and arm64.'
        type: string
        default: '["x86_64"]'
      python_versions:
        description: 'Python versions for wheel builds, e.g. "3.13" or "3.12-3.13"; use "all" for all supported versions.'
        type: string
        default: '3.13'
      upload_artifacts:
        type: boolean
        default: false
      coverage:
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-windows-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}-${{ inputs.coverage }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format_check:
    uses: ./.github/workflows/format-check.yml
    with:
      is_pull_request: ${{ github.event_name == 'pull_request' }}

  build_and_test:
    needs: format_check
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        arch: ${{ fromJSON(inputs.architectures || '["x86_64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2022' }}
    env:
      VCPKG_TARGET_TRIPLET: ${{ matrix.arch == 'arm64' && 'arm64-windows-static-md' || 'x64-windows-static-md' }}
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      PYTHONPATH: ${{ github.workspace }}/tools/python_bind
      GS_TEST_DIR: ${{ github.workspace }}/gstest
      NEUG_ROOT_DIRECTORY: ${{ github.workspace }}
      BUILD_TYPE: RELEASE
      BUILD_TEST: 'ON'
      BUILD_EXECUTABLES: 'ON'
      BUILD_EXTENSIONS: ${{ inputs.extensions }}
      BUILD_HTTP_SERVER: 'ON'
      BUILD_NODEJS: 'ON'
      WITH_MIMALLOC: 'OFF'
      ENABLE_BACKTRACES: 'OFF'
      NEUG_PACKAGE_BUILD: 'ON'
      NEUG_NATIVE_ARCH: 'OFF'
      USE_NINJA: 'OFF'
      CMAKE_INSTALL_PREFIX: /opt/neug-install
      ENABLE_GCOV: ${{ inputs.coverage && 'ON' || 'OFF' }}
      CMAKE_GENERATOR: Ninja
    steps:
    # ========================================
    # Phase 1: Prepare & Build
    # ========================================

    - name: Checkout
      id: checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        ref: ${{ github.sha }}

    - name: Setup Python
      id: python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}

    - name: Install Windows OpenSSL
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $ErrorActionPreference = "Stop"
        & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install "openssl:$env:VCPKG_TARGET_TRIPLET"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Install Python Test Dependencies
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $ErrorActionPreference = "Stop"
        python -m pip install -r tools/python_bind/requirements.txt -r tools/python_bind/requirements_dev.txt pytest-cov coverage wheel setuptools pybind11
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.0.0'
        cache: npm
        cache-dependency-path: tools/nodejs_bind/package-lock.json

    - name: Install Node.js Build Dependencies
      shell: pwsh
      run: |
        npm ci --prefix tools/nodejs_bind

        $nodeVersion = node -p "process.versions.node"
        $nodeArch = node -p "process.arch"
        $nodeDevDir = Join-Path $env:RUNNER_TEMP "node-v$nodeVersion-dev"
        $headersArchive = Join-Path $env:RUNNER_TEMP "node-headers.tar.gz"
        $headersUrl = "https://nodejs.org/dist/v$nodeVersion/node-v$nodeVersion-headers.tar.gz"
        $nodeLibUrl = "https://nodejs.org/dist/v$nodeVersion/win-$nodeArch/node.lib"

        Invoke-WebRequest $headersUrl -OutFile $headersArchive
        New-Item -ItemType Directory -Force $nodeDevDir | Out-Null
        tar -xzf $headersArchive -C $nodeDevDir --strip-components=1
        Invoke-WebRequest $nodeLibUrl -OutFile (Join-Path $nodeDevDir "node.lib")

        "NODE_INCLUDE_DIR=$nodeDevDir\include\node" >> $env:GITHUB_ENV
        "NODE_IMPORT_LIB=$nodeDevDir\node.lib" >> $env:GITHUB_ENV

    - name: Build NeuG
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $ErrorActionPreference = "Stop"
        $python = (Get-Command python).Source
        if ($env:BUILD_EXTENSIONS) {
          foreach ($extension in $env:BUILD_EXTENSIONS.Split(';')) {
            if ($extension -cnotmatch '^[a-z][a-z0-9_]*$') {
              throw "Invalid extension name: '$extension'"
            }
          }
        }
        cmake -S . -B "$env:GITHUB_WORKSPACE/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON=ON -DBUILD_NODEJS=ON "-DNODE_INCLUDE_DIR=$env:NODE_INCLUDE_DIR" "-DNODE_IMPORT_LIB=$env:NODE_IMPORT_LIB" -DBUILD_HTTP_SERVER=ON -DBUILD_TEST=ON "-DBUILD_EXTENSIONS=$env:BUILD_EXTENSIONS" -DWITH_MIMALLOC=OFF -DNEUG_PACKAGE_BUILD=ON -DNEUG_NATIVE_ARCH=OFF "-DPython_EXECUTABLE=$python" "-DPYTHON_EXECUTABLE=$python" "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=$env:VCPKG_TARGET_TRIPLET
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --build "$env:GITHUB_WORKSPACE/build" -j4
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "$env:GITHUB_WORKSPACE/build/src" >> $env:GITHUB_PATH
        "PYTHONPATH=$env:GITHUB_WORKSPACE/tools/python_bind;$env:GITHUB_WORKSPACE/build/tools/python_bind" >> $env:GITHUB_ENV
        "CMAKE_ARGS=-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=$env:VCPKG_TARGET_TRIPLET" >> $env:GITHUB_ENV

    # ========================================
    # Phase 2: C++ Tests
    # ========================================

    - name: Run C++ Tests
      uses: ./.github/actions/test-cpp
      with:
        platform: windows
        extensions: ${{ inputs.extensions }}

    # ========================================
    # Phase 3: Python Tests
    # ========================================

    - name: Run Python Tests
      uses: ./.github/actions/test-python
      with:
        platform: windows
        extensions: ${{ inputs.extensions }}

    # ========================================
    # Phase 4: Node.js Tests
    # ========================================

    - name: Run Node.js Tests and Optional Packaging
      uses: ./.github/actions/test-and-package-nodejs
      with:
        extensions: ${{ inputs.extensions }}
        package: 'true'
        artifact_platform: windows-${{ matrix.arch }}
        upload_artifacts: ${{ inputs.upload_artifacts }}

    # ========================================
    # Phase 6: Wheel Test
    # ========================================

    - name: Wheel Test
      uses: ./.github/actions/package-wheel
      with:
        artifact_platform: windows-${{ matrix.arch }}
        oss_platform: win_${{ matrix.arch }}
        python_versions: ${{ inputs.python_versions || '3.13' }}
        extensions: ${{ inputs.extensions }}
        upload_artifacts: ${{ inputs.upload_artifacts }}

    # ========================================
    # Phase 7: Coverage
    # ========================================

    - name: Generate Coverage
      if: inputs.coverage
      shell: bash
      run: |-
        set -euo pipefail
        cmake --build "$GITHUB_WORKSPACE/build" --target coverage -j4

    - name: Upload Codecov Report
      if: inputs.coverage && github.repository == 'alibaba/neug'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ${{ github.workspace }}/build/coverage_filtered.info
        fail_ci_if_error: true
